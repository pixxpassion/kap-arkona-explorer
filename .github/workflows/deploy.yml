name: Deploy to GitHub Pages

# Veröffentlicht den Build mit Zugangssperre (PasswordGate) unter
# https://pixxpassion.github.io/kap-arkona-explorer/.
# Voraussetzung: das Repo-Secret VITE_ACCESS_PASSWORD (= leuchtturm1875).
# Fehlt es, bricht der Build ab (kein ungeschützter Deploy).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'logs/**'
      - '**/*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Pages-Deploy gleichzeitig, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Secret prüfen
        run: |
          if [ -z "${{ secrets.VITE_ACCESS_PASSWORD }}" ]; then
            echo "::error::Repo-Secret VITE_ACCESS_PASSWORD fehlt - Deploy abgebrochen, damit keine ungeschützte Version online geht."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (mit Zugangssperre, Base-Pfad für Project Pages)
        run: npm run build -- --mode testserver --base=/kap-arkona-explorer/
        env:
          VITE_ACCESS_PASSWORD: ${{ secrets.VITE_ACCESS_PASSWORD }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
