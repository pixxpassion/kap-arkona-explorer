name: Deploy to GitHub Pages

# Veröffentlicht den Testserver-Build (Zugangssperre + Testmodus-Button)
# unter https://pixxpassion.github.io/kap-arkona-explorer/.
# Voraussetzung: die beiden Repo-Secrets
#   VITE_ACCESS_PASSWORD   = leuchtturm1875
#   VITE_ENABLE_TEST_MODE  = true
# Fehlen sie, bricht der Build ab (kein ungeschützter Deploy).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'logs/**'
      - '**/*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Pages-Deploy gleichzeitig, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Secrets prüfen
        run: |
          if [ -z "${{ secrets.VITE_ACCESS_PASSWORD }}" ] || [ "${{ secrets.VITE_ENABLE_TEST_MODE }}" != "true" ]; then
            echo "::error::Repo-Secrets VITE_ACCESS_PASSWORD und VITE_ENABLE_TEST_MODE (=true) fehlen - Deploy abgebrochen, damit keine ungeschützte Version online geht."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Testserver-Modus, Base-Pfad für Project Pages)
        run: npm run build -- --mode testserver --base=/kap-arkona-explorer/
        env:
          VITE_ACCESS_PASSWORD: ${{ secrets.VITE_ACCESS_PASSWORD }}
          VITE_ENABLE_TEST_MODE: ${{ secrets.VITE_ENABLE_TEST_MODE }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
